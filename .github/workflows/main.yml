name: Compilar APK de prueba
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: UltraHDRWallpaper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
